errors.map(t=>'<p>'+esc(t)+'</p>').join(''));return;}if(!confirm('\u00c1p d\u1ee5ng k\u1ebf ho\u1ea1ch n\u00e0y v\u00e0o \u0111\u1ec1? C\u00e1c \u00fd b\u1ecb b\u1ecf s\u1ebd x\u00f3a; \u00fd m\u1edbi c\u1ea7n so\u1ea1n. H\u00e3y t\u1ea3i JSON \u0111\u1ec3 sao l\u01b0u tr\u01b0\u1edbc.'))return;const ex=M.apply(p,state.exam);state.exam=ex;p.dirty=false;p.examSignature=M.signature(ex);touch();render();toast('\u0110\u00e3 \u00e1p d\u1ee5ng khung. Ki\u1ec3m tra t\u1ea1i Bi\u00ean so\u1ea1n c\u00e2u h\u1ecfi.');break;}}}catch(err){toast(err.message);}});

function renderItemDetails(){return head('Ma trận & bản đặc tả','Bảng làm việc mới, có truy vết từng ý. Không thay thế bố cục Excel nguồn.',btn('Thêm ý / tiêu chí','add','primary')+btn('Xuất Excel','xlsx'))+stats()+(state.exam.items.length?'<div class="notice info">'+esc(state.exam.scopeNote||'Bản nháp – chờ giáo viên duyệt. Phần mô tả thao tác đánh giá là nội dung biên soạn, tách khỏi nguyên văn yêu cầu cần đạt.')+'</div>'+alerts('plan')+'<div class="card scroll" style="padding:0"><table class="matrix-table"><thead><tr>'+['Mã ý','Phần thi','Mức / dạng','Nội dung','Yêu cầu cần đạt / thao tác đánh giá','Điểm',''].map(t=>'<th>'+t+'</th>').join('')+'</tr></thead><tbody>'+state.exam.items.map((x,i)=>'<tr><td><strong>'+esc(x.id)+'</strong><div class="small muted">'+esc(x.group)+'</div></td><td>'+C.sectionName(state.meta,x.section)+'</td><td><span class="pill">'+x.level+'</span><div class="small" style="margin-top:5px">'+C.types[x.type]+'</div></td><td>'+esc(x.topic)+'</td><td>'+esc(x.objective)+'<div class="source-label" style="margin-top:5px">'+esc(x.source)+'</div><div class="small" style="margin-top:8px"><strong>Đánh giá:</strong> '+esc(x.assessment)+'</div></td><td><strong>'+fmt(x.points)+'</strong></td><td>'+btn('Sửa','edit-row','mini','data-index="'+i+'"')+'</td></tr>').join('')+'</tbody></table></div><div class="actions">'+btn(state.meta.planApproved?'Ma trận đã chốt':'Xác nhận ma trận','approve-plan','primary')+btn('Soạn câu hỏi bằng AI','ai-draft')+btn('Lấy câu lệnh cho Gemini / ChatGPT','prompt')+'</div><div class="card" style="margin-top:20px"><h3>Phân bố điểm theo mức</h3>'+Object.keys(C.targets(state.meta)).map(k=>{const rows=state.exam.items.filter(x=>x.section===k),sum=rows.reduce((s,x)=>s+x.points,0);return '<div style="margin-bottom:20px"><strong class="small">'+C.sectionName(state.meta,k)+' · mẫu số '+fmt(sum)+' điểm</strong><div class="progress-track">'+C.levels.map(l=>'<i style="width:'+(sum?rows.filter(x=>x.level===l).reduce((s,x)=>s+x.points,0)/sum* function editRow(i){const x=state.exam.items[i],cur=curriculum();if(!x)return;const fs=(key,label,type='text')=>'<div><label>'+label+'</label>'+(type==='textarea'?'<textarea data-row="'+key+'">'+esc(x[key])+'</textarea>':'<input data-row="'+key+'" type="'+type+'" value="'+esc(x[key])+'" '+(key==='points'?'min="0.01" max="20" step="0.25"':'')+'>')+'</div>';const sel=(key,label,map)=>'<div><label>'+label+'</label><select data-row="'+key+'">'+Object.entries(map).map(([v,l])=>'<option value="'+v+'" '+(x[key]===v?'selected':'')+'>'+l+'</option>').join('')+'</select></div>';

function save(){try{state.savedAt=new Date().toISOString();let ids=JSON.parse(localStorage.getItem('trly-index')||'[]').filter(x=>x!==state.id);ids.unshift(state.id);for(const old of ids.slice(20))localStorage.removeItem('trly-'+old);ids=ids.slice(0,20);localStorage.setItem('trly-'+state.id,JSON.stringify(state));localStorage.setItem('trly-index',JSON.stringify(ids));localStorage.setItem('trly-last',state.id);dirty=false;toast('Đã lưu hồ sơ trên trình duyệt này.');if(page==='home')render();}catch{toast('Không lưu được (trình duyệt có thể chặn hoặc hết bộ nhớ). Hãy tải bản sao JSON.');}}

}

function busyAI(title){$('#busyRoot').innerHTML='<div class="busy"><div><div class="spinner"></div><h2>'+esc(title)+'</h2><p>N\u1ebfu Google b\u00e1o l\u1ed7i t\u1ea1m th\u1eddi, web s\u1ebd t\u1ef1 th\u1eed l\u1ea1i c\u00f3 gi\u1edbi h\u1ea1n v\u00e0 chuy\u1ec3n model d\u1ef1 ph\u00f2ng. H\u1ee7y ch\u1edd kh\u00f4ng b\u1ea3o \u0111\u1ea3m h\u1ee7y quota \u0111\u00e3 ph\u00e1t sinh.</p>'+btn('H\u1ee7y ch\u1edd','cancel-ai')+'</div></div>';}
async function connectSimple(){
  if(apiBusy)return;
  let candidate=$('#providerKey')?.value.trim()||'';
  try{ExamDirectAI.validateKey(candidate);const selected=$('#directModel')?.value.trim()||apiModel;ExamDirectAI.setModel(selected);apiModel=selected;}catch(e){toast(e.message);return;}
  if(!confirm('D\u00f9ng kh\u00f3a c\u00e1 nh\u00e2n trong tr\u00ecnh duy\u1ec7t? C\u00e1ch n\u00e0y ti\u1ec7n h\u01a1n nh\u01b0ng k\u00e9m an to\u00e0n h\u01a1n m\u00e1y ch\u1ee7.\n\nTrang s\u1ebd g\u1eedi 1 y\u00eau c\u1ea7u th\u1eed ng\u1eafn tr\u1ef1c ti\u1ebfp t\u1edbi Google Gemini, c\u00f3 th\u1ec3 t\u00ednh ph\u00ed API. Kh\u00f4ng g\u1eedi t\u00e0i li\u1ec7u c\u1ee7a b\u1ea1n trong l\u1ea7n th\u1eed n\u00e0y. Kh\u00f3a kh\u00f4ng \u0111\u01b0\u1ee3c l\u01b0u l\u00e2u d\u00e0i.'))return;
  $('#providerKey').value=''; apiBusy=true; aborter=new AbortController();
  connection={online:false,ai:false,model:''}; busyAI('\u0110ang ki\u1ec3m tra kh\u00f3a v\u1edbi Google Gemini\u2026');
  try{
    const pending=ExamDirectAI.connect(candidate,apiModel,aborter.signal); candidate='';
    const result=await pending;
    connection={online:true,ai:true,model:result.model};consent=true;
    apiModel=result.model; apiMessage='\u0110\u00e3 k\u1ebft n\u1ed1i Google Gemini b\u1eb1ng '+result.model+'. Web \u0111\u00e3 d\u00f2 model kh\u1ea3 d\u1ee5ng v\u00e0 s\u1ebd t\u1ef1 th\u1eed l\u1ea1i/chuy\u1ec3n model d\u1ef1 ph\u00f2ng khi g\u1eb7p l\u1ed7i t\u1ea1m th\u1eddi. Kh\u00f3a ch\u1ec9 d\u00f9ng trong tab n\u00e0y; t\u1ea3i l\u1ea1i trang c\u1ea7n nh\u1eadp l\u1ea1i.';
  }catch(e){ExamDirectAI.clear();connection={online:false,ai:false,model:''};consent=false;apiMessage=e.message;}
  finally{candidate='';apiBusy=false;aborter=null;$('#busyRoot').innerHTML='';render();toast(apiMessage);}
}
function disconnectSimple(){ExamDirectAI.clear();connection={online:false,ai:false,model:''};consent=false;const input=$('#providerKey');if(input)input.value='';apiMessage='\u0110\u00e3 ng\u1eaft v\u00e0 x\u00f3a kh\u00f3a kh\u1ecfi phi\u00ean l\u00e0m vi\u1ec7c. H\u1ed3 s\u01a1 \u0111\u1ec1 v\u1eabn gi\u1eef nguy\u00ean.';render();}
async function handleSimpleAPI(a,el){
  if(a==='connect-key'||a==='check-connection'){await connectSimple();return true;}
  if(a==='disconnect-ai'){disconnectSimple();return true;}
  if(a==='toggle-key'){const input=$('#providerKey');input.type=input.type==='password'?'text':'password';el.textContent=input.type==='password'?'Hi\u1ec7n':'\u1ea8n';return true;}
  if(a==='go-home'){page='home';render();window.scrollTo(0,0);return true;}
  return false;
}

}});
window.addEventListener('pagehide',()=>{ExamDirectAI.clear();const input=$('#providerKey');if(input)input.value='';connection={online:false,ai:false,model:''};consent=false;});

function requestData(action){const cur=curriculum();if(!state.meta.scopeConfirmed||!state.meta.scope.trim())throw Error('Ghi v\u00e0 x\u00e1c nh\u1eadn ph\u1ea1m vi th\u1ef1c d\u1ea1y tr\u01b0\u1edbc.');if(!state.meta.sourceConfirmed||(!cur.text.trim()&&!state.sources.length))throw Error('N\u1ea1p ngu\u1ed3n \u0111\u00fang m\u00f4n/l\u1edbp v\u00e0 x\u00e1c nh\u1eadn ngu\u1ed3n trong H\u1ed3 s\u01a1 \u0111\u1ec1.');if(!C.isComment(state.meta)&&!state.meta.targetsConfirmed)throw Error('X\u00e1c nh\u1eadn thang \u0111i\u1ec3m trong H\u1ed3 s\u01a1 \u0111\u1ec1 tr\u01b0\u1edbc.');if(action==='draft'&&!state.meta.planApproved)throw Error('C\u1ea7n x\u00e1c nh\u1eadn ma tr\u1eadn tr\u01b0\u1edbc.');return {action,meta:state.meta,exam:state.exam,sources:state.sources,curriculum:cur,consent:true};}

  if(apiBusy)return;
  try{
    if(!ExamDirectAI.isReady()){page='connect';render();throw Error('D\u00e1n kh\u00f3a API v\u00e0 b\u1ea5m K\u1ebft n\u1ed1i tr\u01b0\u1edbc.');}
    const d=ExamAIContract.clean(JSON.parse(JSON.stringify(requestData(action))));
    const names=[...(d.curriculum.text?[d.curriculum.name]:[]),...d.sources.map(x=>x.name)];
    if(!confirm('G\u1eedi y\u00eau c\u1ea7u '+(action==='plan'?'l\u1eadp ma tr\u1eadn':'so\u1ea1n c\u00e2u h\u1ecfi')+' cho '+C.profiles[state.meta.profile].name+' tr\u1ef1c ti\u1ebfp t\u1edbi Google Gemini?\nNgu\u1ed3n:\n'+names.join('\n')+'\n\nC\u00f3 th\u1ec3 ph\u00e1t sinh ph\u00ed API. Ch\u1ec9 g\u1eedi n\u1ed9i dung b\u1ea1n \u0111\u01b0\u1ee3c ph\u00e9p x\u1eed l\u00fd, Kh\u00f4ng g\u1eedi \u0111\u1ec1 m\u1eadt, th\u00f4ng tin c\u00e1 nh\u00e2n h\u1ecdc sinh ho\u1eb7c d\u1eef li\u1ec7u nh\u1ea1y c\u1ea3m. D\u1ecbch v\u1ee5 kh\u00f4ng thu ph\u00ed c\u00f3 th\u1ec3 s\u1eed d\u1ee5ng n\u1ed9i dung \u0111\u1ec3 c\u1ea3i thi\u1ec7n s\u1ea3n ph\u1ea9m Google.'))return;
    apiBusy=true;aborter=new AbortController();busyAI('\u0110ang so\u1ea1n v\u1edbi '+ExamDirectAI.model()+'\u2026');
    const body=await ExamDirectAI.generate(d,aborter.signal);const next=C.assertExam(body.exam);
    if(action==='draft'&&!C.matchPlan(state.exam,next))throw Error('K\u1ebft qu\u1ea3 kh\u00f4ng kh\u1edbp ma tr\u1eadn. Ch\u01b0a \u00e1p d\u1ee5ng.');
    state.exam=next;state.meta.kind='draft';state.curriculum=d.curriculum;
    if(action==='plan')delete state.matrixPlan;
    touch(action==='plan');page=action==='plan'?'matrix':'preview';render();
    toast('\u0110\u00e3 nh\u1eadn b\u1ea3n nh\u00e1p AI. Gi\u00e1o vi\u00ean ki\u1ec3m tra tr\u01b0\u1edbc khi d\u00f9ng.');
  }catch(e){
    if(!ExamDirectAI.isReady()){connection={online:false,ai:false,model:''};consent=false;apiMessage=e.message;render();}
    toast(e.message);
  }finally{apiBusy=false;$('#busyRoot').innerHTML='';aborter=null;}
}

function renderObservation(){return head('Ma tr\u1eadn nhi\u1ec7m v\u1ee5 & b\u1ea3n \u0111\u1eb7c t\u1ea3','Theo c\u00e1c c\u1ed9t c\u0103n c\u1ee9 c\u1ee7a m\u1eabu, chuy\u1ec3n ph\u1ea7n \u0111i\u1ec3m sang minh ch\u1ee9ng v\u00e0 ti\u00eau ch\u00ed nh\u1eadn x\u00e9t.',btn('Th\u00eam nhi\u1ec7m v\u1ee5','add','primary')+btn('Xu\u1ea5t Excel','xlsx'))+'<div class="notice info">M\u00f4n n\u00e0y d\u00f9ng nhi\u1ec7m v\u1ee5/th\u1ef1c h\u00e0nh v\u00e0 nh\u1eadn x\u00e9t. Kh\u00f4ng t\u1ef1 quy th\u00e0nh thang 10 hay t\u1ec9 l\u1ec7 \u0111i\u1ec3m.</div><div class="card scroll"><table><thead><tr><th>M\u00e3</th><th>Ch\u1ee7 \u0111\u1ec1</th><th>YCC\u0110 & ngu\u1ed3n</th><th>Thao t\u00e1c / minh ch\u1ee9ng</th><th>D\u1ea1ng & m\u1ee9c</th><th>Ti\u00eau ch\u00ed</th><th></th></tr></thead><tbody>'+state.exam.items.map((x,i)=>'<tr><td>'+esc(x.id)+'</td><td>'+esc(x.topic)+'</td><td>'+esc(x.objective)+'<p class="source-label">'+esc(x.source)+'</p></td><td>'+esc(x.assessment)+'</td><td>'+esc(C.types[x.type])+'<br>'+esc(x.level)+'</td><td>'+esc(x.guide)+'</td><td>'+btn('S\u1eeda','edit-row','mini','data-index="'+i+'"')+'</td></tr>').join('')+'</tbody></table></div><div class="actions">'+btn('X\u00e1c nh\u1eadn ma tr\u1eadn nhi\u1ec7m v\u1ee5','approve-plan','primary')+btn('So\u1ea1n n\u1ed9i dung b\u1eb1ng AI','ai-draft')+'</div>';}
async function handleV2(a,el){if(await handleSimpleAPI(a,el))return true;if(['save','backup'].includes(a))state.curriculum=curriculum();if(a==='add'&&C.isComment(state.meta)){const x=C.newItem('toan',state.exam.items.length+1);x.type='practical';x.points=0;state.exam.items.push(x);touch();editRow(state.exam.items.length-1);return true;}
 if(a==='demo'&&!['T4-GKI','T5-GKI','TV4-GKI','TV5-GKI'].includes(state.meta.profile)){toast('H\u1ed3 s\u01a1 m\u1edbi c\u00f3 khung tr\u1ed1ng, ch\u01b0a c\u00f3 \u0111\u1ec1 minh h\u1ecda \u0111\u00fang m\u00f4n/l\u1edbp. N\u1ea1p ngu\u1ed3n, l\u1eadp ma tr\u1eadn ho\u1eb7c th\u00eam nhi\u1ec7m v\u1ee5.');return true;}
 if(a==='demo'&&!curriculum().text){toast('N\u1ea1p Bo_nguon_chuyen_mon.json trong Kho tri th\u1ee9c tr\u01b0\u1edbc \u0111\u1ec3 m\u1edf minh h\u1ecda g\u1eafn ngu\u1ed3n.');return true;}
 if(a==='xlsx'&&C.isComment(state.meta)){X.download(M.observation(state.meta,state.exam),'Dac_ta_Nhiem_vu_'+state.meta.profile+'.xlsx');return true;}



 if(a==='paste-source'){openModal('D\u00e1n YCC\u0110 / k\u1ebf ho\u1ea1ch','<label>T\u00ean ngu\u1ed3n + v\u1ecb tr\u00ed</label><input id="pSourceName"><label>N\u1ed9i dung</label><textarea id="pSourceText" style="height:240px"></textarea>',btn('Th\u00eam ngu\u1ed3n','save-source','primary'));return true;}
 if(a==='save-source'){const name=$('#pSourceName').value.trim(),text=$('#pSourceText').value.trim();if(!name||text.length<20||text.length>100000||state.sources.length>=20)throw Error('C\u1ea7n t\u00ean ngu\u1ed3n v\u00e0 n\u1ed9i dung 20\u2013100.000 k\u00fd t\u1ef1; t\u1ed1i \u0111a 20 ngu\u1ed3n.');state.sources.push({name,text});state.meta.sourceConfirmed=false;touch();closeModal();render();return true;}
 if(a==='approve-plan'&&!C.isComment(state.meta)&&!state.meta.targetsConfirmed){toast('X\u00e1c nh\u1eadn c\u1ea5u tr\u00fac \u0111i\u1ec3m trong H\u1ed3 s\u01a1 \u0111\u1ec1 tr\u01b0\u1edbc.');return true;}return false;}
document.addEventListener('input',e=>{if(e.target.dataset.target){const n=Number(e.target.value);if(!Number.isFinite(n)||n<=0||n>20)return;state.meta.targets[e.target.dataset.target]=n;state.meta.targetsConfirmed=false;delete state.matrixPlan;touch();}});
document.addEventListener('change',e=>{if(e.target.id==='gradeSelect'){if(dirty&&!confirm('Chuy\u1ec3n kh\u1ed1i l\u1edbp? H\u00e3y t\u1ea3i b\u1ea3n sao tr\u01b0\u1edbc khi b\u1ecf thay \u0111\u1ed5i.')){e.target.value=C.profiles[state.meta.profile].grade;return;}const old=C.profiles[state.meta.profile],grade=Number(e.target.value);const id=Object.keys(C.profiles).find(k=>C.profiles[k].grade===grade&&C.profiles[k].code===old.code)||Object.keys(C.profiles).find(k=>C.profiles[k].grade===grade&&C.profiles[k].code==='T');state=fresh(id);dirty=false;render();}});
$('#importSource').addEventListener('change',async e=>{if(!Array.from(e.target.files).some(f=>f.name.toLowerCase().endsWith('.json')))return;e.stopImmediatePropagation();try{for(const f of e.target.files){if(f.size>8000000)throw Error('T\u1ec7p v\u01b0\u1ee3t 8 MB.');const z=JSON.parse(await f.text());if(z.version!==2||!z.curricula)throw Error('D\u00f9ng Bo_nguon_chuyen_mon.json c\u1ee7a b\u1ea3n v2.');const safe={};for(const [k,v] of Object.entries(z.curricula)){if(!/^(toan|tv)[1-5]$/.test(k)||!v||typeof v.text!=='string'||v.text.length>100000||typeof v.name!=='string'||typeof v.locator!=='string')throw Error('Ngu\u1ed3n sai c\u1ea5u tr\u00fac.');safe[k]={name:v.name.slice(0,200),locator:v.locator.slice(0,200),text:v.text};}Object.assign(KNOWLEDGE.curricula,safe);try{localStorage.setItem('trly-v2-library',JSON.stringify({version:2,curricula:KNOWLEDGE.curricula}));}catch{toast('Ngu\u1ed3n ch\u1ec9 gi\u1eef trong phi\u00ean; l\u01b0u b\u1ea3n JSON \u0111\u1ec3 tr\u00e1nh m\u1ea5t.');}state.meta.sourceConfirmed=false;touch();render();toast('\u0110\u00e3 n\u1ea1p ch\u01b0\u01a1ng tr\u00ecnh To\u00e1n / Ti\u1ebfng Vi\u1ec7t l\u1edbp 1\u20135.');}}catch(err){toast(err.message);}finally{e.target.value='';}},true);

render();

})();
</script>
